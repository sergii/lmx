name: Regenerate structure temp

on:
  push:
    branches: [ feat/mcp-persisted-oauth-grants ]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/application/Gemfile
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_TEST_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    defaults:
      run:
        working-directory: application
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/mcp-persisted-oauth-grants
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
          bundler-cache: true
      - name: Build schema from migrations
        run: |
          bin/rails db:drop db:create db:structure:load
          bin/rails runner 'ActiveRecord::Base.connection_pool.migration_context.migrate'

          container_id="$(docker ps --filter ancestor=postgres:18.4 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" pg_dump \
            --schema-only \
            --no-privileges \
            --no-owner \
            --username=lmx \
            lmx_test > db/structure.sql

          mapfile -t versions < <(
            docker exec "$container_id" psql \
              --username=lmx \
              --dbname=lmx_test \
              --tuples-only \
              --no-align \
              --command='SELECT version FROM schema_migrations ORDER BY version'
          )
          {
            printf '\n\nINSERT INTO public.schema_migrations (version) VALUES\n'
            last_index=$((${#versions[@]} - 1))
            for index in "${!versions[@]}"; do
              suffix=','
              if [ "$index" -eq "$last_index" ]; then suffix=';'; fi
              printf "('%s')%s\n" "${versions[$index]}" "$suffix"
            done
          } >> db/structure.sql

          grep -q "20260904210000" db/structure.sql
          grep -q "integration_mcp_oauth_grants" db/structure.sql
          grep -q "integration_mcp_oauth_grant_events" db/structure.sql
      - name: Commit generated structure and remove temporary workflow
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/db/structure.sql
          git rm .github/workflows/regenerate-structure-temp.yml
          git diff --cached --quiet && { echo "Expected generated changes" >&2; exit 1; }
          git commit -m "Regenerate database structure"
          git push origin HEAD:feat/mcp-persisted-oauth-grants
