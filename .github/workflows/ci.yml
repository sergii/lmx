name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/application/Gemfile
    defaults:
      run:
        working-directory: application
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
          bundler-cache: true
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  package_boundaries:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/application/Gemfile
    defaults:
      run:
        working-directory: application
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
          bundler-cache: true
      - name: Check canonical/runtime configuration drift
        run: |
          cmp ../config/sources.yml config/sources.yml
          cmp ../config/sources.schema.json config/sources.schema.json
          cmp ../config/profiles/default.yml config/profiles/default.yml
          cmp ../config/profiles.schema.json config/profiles.schema.json
      - name: Validate LMX configuration contract
        run: bin/rails lmx:config:validate
      - name: Validate package system
        run: bin/packwerk validate
      - name: Check package dependencies
        run: bin/packwerk check

  deployment_config:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/application/Gemfile
      LMX_STAGING_HOST: 127.0.0.1
      LMX_STAGING_HOSTNAME: staging.lmx.invalid
      LMX_STAGING_DATA_VOLUME_PATH: /mnt/HC_Volume_1
      KAMAL_REGISTRY_USERNAME: sergii
      KAMAL_REGISTRY_PASSWORD: ci-registry-token
      RAILS_MASTER_KEY: ci-master-key
      DATABASE_URL: postgresql://lmx_app:runtime@db.invalid/lmx_primary
      CACHE_DATABASE_URL: postgresql://lmx_app:runtime@db.invalid/lmx_cache
      QUEUE_DATABASE_URL: postgresql://lmx_app:runtime@db.invalid/lmx_queue
      CABLE_DATABASE_URL: postgresql://lmx_app:runtime@db.invalid/lmx_cable
      DATABASE_MIGRATION_URL: postgresql://lmx_owner:owner@db.invalid/lmx_primary
      CACHE_DATABASE_MIGRATION_URL: postgresql://lmx_owner:owner@db.invalid/lmx_cache
      QUEUE_DATABASE_MIGRATION_URL: postgresql://lmx_owner:owner@db.invalid/lmx_queue
      CABLE_DATABASE_MIGRATION_URL: postgresql://lmx_owner:owner@db.invalid/lmx_cable
      POSTGRES_OWNER_PASSWORD: owner
      POSTGRES_RUNTIME_PASSWORD: runtime
      LMX_PHASE0_WORKSPACE_ID: 00000000-0000-0000-0000-000000000001
      TELEGRAM_BOT_TOKEN: ci-telegram-token
      TELEGRAM_CHAT_ID: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.invalid
      OTEL_EXPORTER_OTLP_HEADERS: authorization=ci
      LMX_MCP_OAUTH_AUTHORIZATION_SERVERS: https://auth.invalid/issuer
      LMX_MCP_OAUTH_SCOPES: read:openings,read:candidates,read:matches,read:applications,assess:matches,submit:openings
      LMX_MCP_OAUTH_INTROSPECTION_ENDPOINT: https://auth.invalid/introspect
      LMX_MCP_OAUTH_INTROSPECTION_CLIENT_ID: ci-lmx-mcp
      LMX_MCP_OAUTH_INTROSPECTION_CLIENT_SECRET: ci-mcp-secret
    defaults:
      run:
        working-directory: application
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
          bundler-cache: true
      - name: Validate deployment scripts
        run: bash -n bin/prepare-database bin/provision-runtime-databases bin/prepare-staging-host
      - name: Validate staging Kamal configuration
        run: bin/kamal config -d staging > /dev/null

  lint_js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Check formatting
        run: npm run format
      - name: Type check
        run: npm run check

  lint:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/application/Gemfile
      RUBOCOP_CACHE_ROOT: ${{ github.workspace }}/application/tmp/rubocop
    defaults:
      run:
        working-directory: application
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
          bundler-cache: true
      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('application/.ruby-version', 'application/**/.rubocop.yml', 'application/**/.rubocop_todo.yml', 'application/Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/application/Gemfile
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    defaults:
      run:
        working-directory: application
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git node-gyp pkg-config python-is-python3 google-chrome-stable
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      - name: Prepare PostgreSQL test schema
        run: bin/rails db:test:prepare
      - name: Run test suite, including the direct RLS boundary proof
        run: bin/rspec
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/application/tmp/capybara
          if-no-files-found: ignore
