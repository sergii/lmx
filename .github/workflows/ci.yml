name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format_applications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install JS dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Improve drag handle and format Applications UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/javascript/pages/applications/index.tsx")
          text = path.read_text()
          text = text.replace(
              '  Columns3,\n  List,\n',
              '  Columns3,\n  GripVertical,\n  List,\n',
          )
          pattern = re.compile(
              r'''      <button\n'''
              r'''        type="button"\n'''
              r'''        \{\.\.\.attributes\}\n'''
              r'''        \{\.\.\.listeners\}\n'''
              r'''        aria-label=\{`Drag \$\{application\.opening\?\.title \?\? "application"\}`\}\n'''
              r'''        className="mb-2 w-full cursor-grab text-left active:cursor-grabbing"\n'''
              r'''      >\n'''
              r'''        <ApplicationTitle application=\{application\} />\n'''
              r'''      </button>'''
          )
          replacement = '''      <div className="mb-2 flex items-start gap-2">
                <button
                  type="button"
                  {...attributes}
                  {...listeners}
                  aria-label={`Drag ${application.opening?.title ?? "application"}`}
                  className="text-muted-foreground mt-0.5 cursor-grab active:cursor-grabbing"
                >
                  <GripVertical className="size-4" />
                </button>
                <ApplicationTitle application={application} />
              </div>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one drag-card markup match, got {count}")
          path.write_text(text)
          PY
          npx prettier --write app/javascript/pages/applications/index.tsx
      - name: Commit formatted Applications UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/javascript/pages/applications/index.tsx
          if git diff --cached --quiet; then
            echo "Applications UI is already canonical"
            exit 0
          fi
          git commit -m "Format canonical applications UI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
