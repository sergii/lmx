name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate_structure:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/application/Gemfile
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: lmx
      POSTGRES_PASSWORD: lmx_test
      POSTGRES_TEST_DATABASE: lmx_test
    defaults:
      run:
        working-directory: application
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: lmx_test
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: lmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx -d lmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
          bundler-cache: true
      - name: Generate canonical PostgreSQL structure
        run: |
          bin/rails db:test:prepare
          bin/rails runner 'ActiveRecord::Base.connection_pool.migration_context.migrate'
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:18.4 \
            pg_dump -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" \
              --schema-only --no-privileges --no-owner "$POSTGRES_TEST_DATABASE" \
            > db/structure.sql
      - name: Commit generated structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/structure.sql
          if git diff --cached --quiet; then
            echo "Structure is already canonical"
            exit 0
          fi
          git commit -m "Update canonical PostgreSQL structure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
