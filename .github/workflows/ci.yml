name: Personal CRM repair

on:
  push:
    branches: [ feat/applications-workflow ]

permissions:
  contents: write

jobs:
  repair_personal_crm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/applications-workflow
      - name: Repair Personal CRM command semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api_path = Path("application/packs/personal_crm/app/public/personal_crm/api.rb")
          text = api_path.read_text()

          replacements = [
              (
                  '''        job_opening_id:,
                  via_posting_id:,
                  channel:
                }.compact''',
                  '''        job_opening_id:,
                  via_posting_id:,
                  channel:,
                  metadata: metadata.deep_dup
                }.compact''',
              ),
              (
                  '''        started_at = Time.current

                  if context.dig(:disposition, :state) != "saved"''',
                  '''        started_at = Time.current
                  was_saved = context.dig(:disposition, :state) == "saved"
                  decided_at = was_saved ? context.dig(:disposition, :decided_at) : started_at

                  unless was_saved''',
              ),
              (
                  '''          disposition: disposition_snapshot(
                    workspace_id:,
                    candidate_id:,
                    job_opening_id:,
                    stream_id:,
                    state: "saved",
                    decided_at: started_at
                  ),''',
                  '''          disposition: disposition_snapshot(
                    workspace_id:,
                    candidate_id:,
                    job_opening_id:,
                    stream_id:,
                    state: "saved",
                    decided_at:
                  ),''',
              ),
              (
                  '''        when APPLICATION_STARTED
                  disposition = disposition_snapshot(
                    workspace_id:,
                    candidate_id:,
                    job_opening_id:,
                    stream_id: event.fetch(:aggregate_id),
                    state: "saved",
                    decided_at: event[:effective_at] || event.fetch(:occurred_at)
                  )
                  applications << application_snapshot(data, event:)''',
                  '''        when APPLICATION_STARTED
                  unless disposition&.dig(:state) == "saved"
                    disposition = disposition_snapshot(
                      workspace_id:,
                      candidate_id:,
                      job_opening_id:,
                      stream_id: event.fetch(:aggregate_id),
                      state: "saved",
                      decided_at: event[:effective_at] || event.fetch(:occurred_at)
                    )
                  end
                  applications << application_snapshot(data, event:)''',
              ),
              (
                  '''        started_at: data.fetch(:started_at),''',
                  '''        started_at: event[:effective_at] || event.fetch(:occurred_at),''',
              ),
          ]

          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"expected Personal CRM source fragment not found: {old[:80]!r}")
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              api_path.write_text(text)

          spec_path = Path("application/packs/personal_crm/spec/public/personal_crm/api_spec.rb")
          spec = spec_path.read_text()
          marker = '  it "changes stage through an immutable event and keeps Opening Detail reduction current" do\n'
          test = '''  it "treats application metadata as part of the idempotency payload" do
            WorkspaceContext.with(organization, membership:) do
              attributes = {
                workspace_id: organization.typed_id,
                candidate_id: candidate.fetch(:id),
                job_opening_id: opening.fetch(:id)
              }

              described_class.start_application(
                **attributes,
                metadata: { "source" => "first" },
                command: command("apply-metadata-1")
              )

              expect do
                described_class.start_application(
                  **attributes,
                  metadata: { "source" => "second" },
                  command: command("apply-metadata-1")
                )
              end.to raise_error(PersonalCrm::Api::ContractViolation, /payload conflicts/i)
            end
          end

'''
          if test not in spec:
              if marker not in spec:
                  raise SystemExit("Personal CRM API spec insertion marker not found")
              spec_path.write_text(spec.replace(marker, test + marker, 1))
          PY
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/packs/personal_crm/app/public/personal_crm/api.rb application/packs/personal_crm/spec/public/personal_crm/api_spec.rb
          if git diff --cached --quiet; then
            echo "Personal CRM repairs are already applied"
            exit 0
          fi
          git commit -m "Harden Personal CRM command semantics"
          git push origin HEAD:feat/applications-workflow
