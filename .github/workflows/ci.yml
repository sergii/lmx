name: CI

on:
  push:
    branches: [ feat/applications-workflow ]

permissions:
  contents: write

jobs:
  repair_structure_metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/applications-workflow
      - name: Restore Rails migration metadata table
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("application/db/structure.sql")
          text = path.read_text()
          marker = '\n\nINSERT INTO "schema_migrations" (version) VALUES\n'
          if marker not in text:
              raise SystemExit("schema_migrations data marker was not found")
          if "CREATE TABLE public.schema_migrations" not in text:
              ddl = "\n\nCREATE TABLE public.schema_migrations (\n    version character varying NOT NULL\n);\n\nALTER TABLE ONLY public.schema_migrations\n    ADD CONSTRAINT schema_migrations_pkey PRIMARY KEY (version);\n"
              text = text.replace(marker, ddl + marker, 1)
          path.write_text(text)
          PY
      - name: Commit repaired structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/db/structure.sql
          if git diff --cached --quiet; then
            echo "Structure metadata is already present"
            exit 0
          fi
          git commit -m "Restore Rails migration metadata table"
          git push origin HEAD:feat/applications-workflow
