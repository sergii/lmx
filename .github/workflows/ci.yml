name: Personal CRM result repair

on:
  push:
    branches: [ feat/applications-workflow ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/applications-workflow
      - name: Normalize public command results
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("application/packs/personal_crm/app/public/personal_crm/api.rb")
          text = path.read_text()
          old = '''      command_executor.call(command_id: provenance.fetch(:command_id)) do
                yield provenance
              end.fetch(:result)
          '''
          new = '''      result = command_executor.call(command_id: provenance.fetch(:command_id)) do
                yield provenance
              end.fetch(:result)
              deep_freeze(result.deep_symbolize_keys)
          '''
          if new in text:
              raise SystemExit("result normalization already applied")
          if old not in text:
              raise SystemExit("expected execute_command fragment not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/packs/personal_crm/app/public/personal_crm/api.rb
          git commit -m "Normalize Personal CRM command results"
          git push origin HEAD:feat/applications-workflow
