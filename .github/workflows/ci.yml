name: CI

on:
  push:
    branches: [ feat/applications-workflow ]

permissions:
  contents: write

jobs:
  qualify_schema_migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/applications-workflow
      - name: Qualify schema migrations insert
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("application/db/structure.sql")
          text = path.read_text()
          old = 'INSERT INTO "schema_migrations" (version) VALUES'
          new = 'INSERT INTO public.schema_migrations (version) VALUES'
          if old not in text:
              raise SystemExit("unqualified schema_migrations INSERT was not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repaired structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/db/structure.sql
          git commit -m "Qualify Rails migration metadata insert"
          git push origin HEAD:feat/applications-workflow
