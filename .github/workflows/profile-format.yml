name: Candidate profile formatter

on:
  push:
    branches: [ feat/candidate-profile-workflow ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/candidate-profile-workflow
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - name: Format candidate profile page
        run: npx prettier --write app/javascript/pages/profile/show.tsx
      - name: Commit formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/app/javascript/pages/profile/show.tsx
          git commit -m "Format candidate profile page"
          git push origin HEAD:feat/candidate-profile-workflow
