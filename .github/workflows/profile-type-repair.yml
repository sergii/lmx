name: Candidate profile type repair

on:
  push:
    branches: [ feat/candidate-profile-workflow ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/candidate-profile-workflow
      - name: Repair Inertia profile payload type
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("application/app/javascript/pages/profile/show.tsx")
          text = path.read_text()
          old = '      { profile },\n'
          new = '      { profile: profile as ProfileData },\n'
          if old not in text:
              raise SystemExit("expected profile payload fragment not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/profile-type-repair.yml
          git add application/app/javascript/pages/profile/show.tsx
          git commit -m "Fix candidate profile Inertia payload type"
          git push origin HEAD:feat/candidate-profile-workflow
