name: Manual opening formatter

on:
  push:
    branches: [ feat/manual-opening-submission ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/manual-opening-submission
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - name: Format manual opening page
        run: npx prettier --write app/javascript/pages/openings/new.tsx
      - name: Commit formatting and remove helper workflow
        working-directory: .
        run: |
          rm .github/workflows/manual-opening-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/app/javascript/pages/openings/new.tsx .github/workflows/manual-opening-format.yml
          git commit -m "Format manual opening page"
          git push origin HEAD:feat/manual-opening-submission
