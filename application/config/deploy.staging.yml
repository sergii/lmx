servers:
  web:
    - <%= ENV.fetch("LMX_STAGING_HOST") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("LMX_STAGING_HOSTNAME") %>

env:
  clear:
    LMX_PUBLIC_BASE_URL: https://<%= ENV.fetch("LMX_STAGING_HOSTNAME") %>
    LMX_MCP_HTTP_ALLOWED_HOSTS: <%= ENV.fetch("LMX_STAGING_HOSTNAME") %>
    LMX_MCP_OAUTH_RESOURCE: https://<%= ENV.fetch("LMX_STAGING_HOSTNAME") %>/mcp
    LMX_MCP_OAUTH_RESOURCE_NAME: LMX MCP staging

volumes:
  - "<%= ENV.fetch("LMX_STAGING_DATA_VOLUME_PATH") %>/storage:/rails/storage"

accessories:
  db:
    service: lmx-staging-db
    image: postgres:18.4
    host: <%= ENV.fetch("LMX_STAGING_HOST") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: lmx_owner
        POSTGRES_DB: lmx_primary
        POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      secret:
        - POSTGRES_PASSWORD:POSTGRES_OWNER_PASSWORD
    files:
      - config/postgres/init-lmx-databases.sql:/docker-entrypoint-initdb.d/10-lmx-databases.sql:ro
    volumes:
      - "<%= ENV.fetch("LMX_STAGING_DATA_VOLUME_PATH") %>/postgres:/var/lib/postgresql"
