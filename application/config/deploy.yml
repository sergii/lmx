# Canonical Kamal deployment configuration. Environment-specific hosts, proxy
# names and persistent volumes live in config/deploy.<destination>.yml.
service: lmx
image: sergii/lmx
require_destination: true

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "sergii") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - LMX_PHASE0_WORKSPACE_ID
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_CHAT_ID
    - OTEL_EXPORTER_OTLP_ENDPOINT
    - OTEL_EXPORTER_OTLP_HEADERS
    - LMX_MCP_OAUTH_AUTHORIZATION_SERVERS
    - LMX_MCP_OAUTH_SCOPES
    - LMX_MCP_OAUTH_INTROSPECTION_ENDPOINT
    - LMX_MCP_OAUTH_INTROSPECTION_CLIENT_ID
    - LMX_MCP_OAUTH_INTROSPECTION_CLIENT_SECRET
  clear:
    SOLID_QUEUE_IN_PUMA: true
    OTEL_SERVICE_NAME: lmx
    LMX_POSTING_LIFECYCLE_POLICY_VERSION: "<%= ENV.fetch("LMX_POSTING_LIFECYCLE_POLICY_VERSION", "v1") %>"
    LMX_POSTING_PROBABLY_CLOSED_AFTER_MISSES: "<%= ENV.fetch("LMX_POSTING_PROBABLY_CLOSED_AFTER_MISSES", "3") %>"
    LMX_POSTING_CLOSED_AFTER_MISSES: "<%= ENV.fetch("LMX_POSTING_CLOSED_AFTER_MISSES", "") %>"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  phase0: app exec --primary --reuse "bin/rails lmx:phase0:check"

asset_path: /rails/public

builder:
  arch: amd64
  cache:
    type: registry
    options: mode=max
