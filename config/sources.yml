version: 1

# Canonical machine-readable registry of external acquisition sources.
# Personal ranking/search policy belongs in config/profiles/, not here.

sources:
  - id: dou
    name: DOU Jobs
    base_url: https://jobs.dou.ua/
    enabled: true
    market: ua
    kind: job_board
    acquisition:
      - type: rss
        preference: primary
        status: active
      - type: http_html
        preference: fallback
        status: active
      - type: browser
        preference: fallback
        status: evaluate
    access:
      requires_auth: false
      robots_review: pending
      terms_review: pending
      rate_limit: unknown

