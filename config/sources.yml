version: 1

# Canonical machine-readable catalog of external opportunity sources.
# Source facts live here. Personal targets, ranking and query policy live in config/profiles/.

sources:
  - id: dou
    name: DOU Jobs
    base_url: https://jobs.dou.ua/
    enabled: true
    market: ua
    kind: job_board
    coverage:
      scope: focused
      domains: [technology]
    lifecycle:
      status: active
    acquisition:
      - type: rss
        preference: primary
        status: active
      - type: http_html
        preference: fallback
        status: active
      - type: browser
        preference: fallback
        status: evaluate
    access:
      requires_auth: false
      robots_review: pending
